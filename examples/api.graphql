# GraphQL Schema Example

type Account {
  id: ID!
  email: String!
  username: String!
  isActive: Boolean!
  posts: [Post!]!
}

type Post {
  id: ID!
  title: String!
  body: String!
  author: Account!
  tags: [Tag!]!
  publishedAt: String
}

type Tag {
  id: ID!
  name: String!
  posts: [Post!]!
}
